name: GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require Supabase secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::This Pages build has no hosted backend. Add repository Actions secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions), then re-run this workflow."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_HASH_ROUTER: "1"
          VITE_BASE: ${{ vars.VITE_BASE || '/DND-APP-/' }}
      - name: Confirm backend was baked in
        run: |
          if ! grep -q 'supabase.co' dist/assets/*.js; then
            echo "::error::Vite build did not embed a Supabase URL. Check VITE_SUPABASE_URL."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish /docs for branch-based Pages
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          rm -rf docs
          mkdir -p docs
          cp -a dist/. docs/
          cat > docs/_config.yml <<'EOF'
          defaults:
            - scope:
                path: ""
              values:
                layout: none
          EOF
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "docs/ already matches this build"
            exit 0
          fi
          git commit -m "Publish GitHub Pages site to docs/"
          git push origin HEAD:main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
